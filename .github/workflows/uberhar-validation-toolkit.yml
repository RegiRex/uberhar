# AstraPro: Read-only tooling branch, never APK/signing/publication; no credentials archived.
name: Uberhar validation toolkit
on:
  push:
    branches: [uberhar/validation-toolkit-0.1.8]
    paths: [.github/workflows/uberhar-validation-toolkit.yml]
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: e8b53b12db77b7b8f0345cbcb81038947782baf7
          persist-credentials: false
      - name: Install shader validators and host syntax headers
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools robin-map-dev python3-pip
      - name: Package public tools and source headers
        run: |
          mkdir -p "$RUNNER_TEMP/toolkit/bin" "$RUNNER_TEMP/toolkit/include" "$RUNNER_TEMP/toolkit/wheels"
          cp /usr/bin/glslangValidator /usr/bin/spirv-val /usr/bin/spirv-opt "$RUNNER_TEMP/toolkit/bin/"
          cp -R /usr/include/tsl "$RUNNER_TEMP/toolkit/include/"
          python3 -m pip download --only-binary=:all: --platform manylinux2014_x86_64 --python-version 313 --implementation cp --abi cp313 -d "$RUNNER_TEMP/toolkit/wheels" moderngl==5.12.0 glcontext==3.0.0
          git rev-parse HEAD > "$RUNNER_TEMP/toolkit/source-commit.txt"
          dpkg-query -W glslang-tools spirv-tools robin-map-dev > "$RUNNER_TEMP/toolkit/tool-versions.txt"
          ldd /usr/bin/glslangValidator /usr/bin/spirv-val /usr/bin/spirv-opt > "$RUNNER_TEMP/toolkit/dependencies.txt"
          tar -czf "$RUNNER_TEMP/uberhar-validation-toolkit.tar.gz" -C "$RUNNER_TEMP" toolkit
      - uses: actions/upload-artifact@v4
        with:
          name: uberhar-validation-toolkit-018
          path: ${{ runner.temp }}/uberhar-validation-toolkit.tar.gz
          retention-days: 1
