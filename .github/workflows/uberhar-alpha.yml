# AstraEH: Build, verify and publish the isolated ARM64 experimental app.
# AstraEH: The same gated workflow now also publishes the Native beta milestone.
name: Uberhar ARM64 prerelease

on:
  workflow_dispatch:
  push:
    # CodexAstraUlt: Replace comparison push builds, which cannot see a sibling's
    # signing cache, with the trusted PR path below. Preserve release-branch pushes.
    branches: [uberhar/hybrid-shaders]
    paths:
      - src/**
      - CMakeModules/**
      - .github/workflows/uberhar-alpha.yml
      - .github/workflows/uberhar-shaders.yml
      - tools/uberhar/**
      - UBERHAR_VERSION
      - docs/releases/**
  # CodexAstraUlt: A PR may restore its base branch's existing cache if retained.
  # Both jobs reject forks/other heads; this is never a pull_request_target workflow.
  pull_request:
    branches: [uberhar/hybrid-shaders]
    types: [opened, synchronize, reopened]
    paths:
      - src/**
      - CMakeModules/**
      - .github/workflows/uberhar-alpha.yml
      - .github/workflows/uberhar-shaders.yml
      - tools/uberhar/**
      - UBERHAR_VERSION
      - docs/releases/**

permissions:
  contents: read

concurrency:
  # CodexAstraUlt: Preserve the release queue while comparison jobs use their own
  # queue, so this parallel experiment cannot delay the owner's other builds.
  group: ${{ github.ref == 'refs/heads/uberhar/hybrid-shaders' && 'uberhar-alpha' || 'uberhar-alpha-comparison' }}
  # CodexAstraUlt: Replace the failed-run supersession policy with queueing again:
  # the owner wants the preceding comparison APK, so preserve its active build.
  cancel-in-progress: false

jobs:
  # AstraEH: Reuse the shader gate and require its success before publishing any pre-release.
  shaders:
    # CodexAstraUlt: Only the owner's exact same-repository comparison PR can run
    # these jobs. Retain main pushes and deliberate main/comparison manual runs.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'uberhar/hybrid-shaders' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'uberhar/codexastra-diag-comparison') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/uberhar/hybrid-shaders') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/uberhar/hybrid-shaders' ||
        github.ref == 'refs/heads/uberhar/codexastra-diag-comparison'))
    uses: ./.github/workflows/uberhar-shaders.yml
    with:
      # CodexAstraUlt: Test the exact comparison head, not GitHub's synthetic merge.
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  android:
    # CodexAstraUlt: Repeat the trust guard on the signing job itself; it must not
    # depend on a shader-job result to exclude untrusted branches and fork PRs.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'uberhar/hybrid-shaders' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'uberhar/codexastra-diag-comparison') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/uberhar/hybrid-shaders') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/uberhar/hybrid-shaders' ||
        github.ref == 'refs/heads/uberhar/codexastra-diag-comparison'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          # CodexAstraUlt: Keep concurrent base changes out of the comparison APK;
          # the existing git rev-parse provenance records this checked-out SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      # AstraEH: Share one numeric release.beta.alpha version across Gradle, assets and publication.
      - name: Read release version
        id: version
        run: |
          UBERHAR_VERSION="$(cat UBERHAR_VERSION)"
          [[ "$UBERHAR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "docs/releases/$UBERHAR_VERSION.md"
          echo "value=$UBERHAR_VERSION" >> "$GITHUB_OUTPUT"
          echo "UBERHAR_VERSION=$UBERHAR_VERSION" >> "$GITHUB_ENV"
          python3 tools/uberhar/test_manifest.py

      # CodexAstraLocal: Execute the real overlay lifecycle methods before signing
      # or building. Pin the official compiler archive before extraction; this
      # modeled Handler regression complements Android compilation and unit tests.
      - name: Test performance overlay callback lifecycle
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          overlay_tools="$(mktemp -d "$RUNNER_TEMP/uberhar-overlay-XXXXXX")"
          trap 'rm -rf -- "$overlay_tools"' EXIT
          overlay_java="$JAVA_HOME_17_X64/bin/java"
          test -x "$overlay_java"
          "$overlay_java" -version 2> "$overlay_tools/java-version.txt"
          cat "$overlay_tools/java-version.txt"
          grep -Eq '^(openjdk|java) version "17([."]|$)' "$overlay_tools/java-version.txt"
          overlay_url='https://github.com/JetBrains/kotlin/releases/download/v2.0.20/kotlin-compiler-2.0.20.zip'
          overlay_sha256='5f5d2a8ad6a718a002acd0775b67a9e27035872fdbd4b0791e3cb3ea00095931'
          overlay_archive="$overlay_tools/kotlin-compiler-2.0.20.zip"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 2 \
            --retry-max-time 150 --output "$overlay_archive" "$overlay_url"
          printf 'Kotlin 2.0.20 official archive: %s\nPinned SHA-256: %s\n' \
            "$overlay_url" "$overlay_sha256"
          printf '%s  %s\n' "$overlay_sha256" "$overlay_archive" | sha256sum --check --strict
          python3 -m zipfile -e "$overlay_archive" "$overlay_tools"
          chmod u+x "$overlay_tools/kotlinc/bin/kotlinc"
          python3 tools/uberhar/test_performance_overlay.py \
            --kotlinc "$overlay_tools/kotlinc/bin/kotlinc" --java "$overlay_java" \
            --output "$overlay_tools/regression"

      - name: Cache compilation dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/ccache
          key: uberhar-android-v1-${{ github.run_id }}
          restore-keys: |
            uberhar-android-v1-
            baseline-android-v1-

      - name: Reuse development signing key when available
        # CodexAstraUlt: Preserve inherited main-branch cache saving only on main.
        if: github.ref == 'refs/heads/uberhar/hybrid-shaders'
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: uberhar-development-signing-v1

      # CodexAstraUlt: Comparison jobs only restore the existing cache; they do not
      # create a private-key cache or artifact. A missing/evicted key still fails closed.
      - name: Restore existing comparison signing key
        if: github.ref != 'refs/heads/uberhar/hybrid-shaders'
        uses: actions/cache/restore@v5
        with:
          path: ~/.android/debug.keystore
          key: uberhar-development-signing-v1

      # AstraEH: Use an explicit key path; AGP's implicit debug-key location was not cached.
      # This development key is not a durable release-signing setup; see UBERHAR.md.
      - name: Prepare development signing key
        run: |
          mkdir -p "$HOME/.android"
          # CodexAstraUlt: Extend the existing comparison preflight to PR merge refs;
          # only main retains inherited key generation. Every comparison must restore
          # the approved key and pass the retained final APK certificate gate.
          if [ "$GITHUB_REF" != refs/heads/uberhar/hybrid-shaders ]; then
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              echo '::error title=Comparison signing key unavailable::The approved development signing key was not restored. No replacement key was generated.'
              exit 1
            fi
            # CodexAstraUlt: Export only the public certificate, remove its temporary
            # file on every exit, and compare the existing pin without exposing key data.
            comparison_certificate="$(mktemp)"
            trap 'rm -f "$comparison_certificate"' EXIT
            if ! "$JAVA_HOME_17_X64/bin/keytool" -exportcert \
              -keystore "$HOME/.android/debug.keystore" -storepass android \
              -alias androiddebugkey -file "$comparison_certificate"; then
              echo '::error title=Comparison signing key unreadable::The restored development key could not supply its public certificate. No replacement key was generated.'
              exit 1
            fi
            comparison_digest="$(sha256sum "$comparison_certificate" | cut -d ' ' -f 1)"
            if [ "$comparison_digest" != "$(cat tools/uberhar/development-certificate.sha256)" ]; then
              echo '::error title=Comparison signing key mismatch::The restored development key does not match the approved certificate. The pinned certificate and final APK gate remain unchanged.'
              exit 1
            fi
            rm -f "$comparison_certificate"
            trap - EXIT
          fi
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Uberhar Development,O=Uberhar,C=US"
          fi

      - name: Install build tools
        # CodexAstraLocal: Execute the production ARM64 return/ABI contract under
        # QEMU using the same NDK as the app before any candidate can be packaged.
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build qemu-user
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.3.13750724" "cmake;3.30.3"

      - name: Execute ARM64 shader return contract
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          python3 tools/uberhar/test_shader_a64_return.py
          # CodexAstraLocal: Qualify sleeping dispatch, fallback and borrowed-job
          # lifetime on the app's NDK target within the existing required gate.
          python3 tools/uberhar/test_parallel_work_transport.py \
            --compiler "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --qemu "$(command -v qemu-aarch64)"

      # CodexAstraLocal: Narrow writeback must preserve raw disabled lanes,
      # current output banks and preceding arithmetic/FP effects before packaging.
      - name: Execute ARM64 shader writeback contract
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          python3 tools/uberhar/test_shader_a64_writeback.py

      # CodexAstraLocal: Selected-output shader independence requires guest CPU
      # status isolation across real A64 service and memory callback boundaries.
      - name: Execute ARM64 guest FP status contract
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          python3 tools/uberhar/test_guest_a64_fpsr.py

      # CodexAstraLocal: Widen admission only after current A64 arithmetic,
      # ordered FIFO/assembly and output-sensitive negative controls pass.
      - name: Execute ARM64 observable vertex contract
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          python3 tools/uberhar/test_parallel_vertex_observable.py
          # CodexAstraLocal: Execute the actual loader's packed-register contract
          # on the app target, including inherited-decoder and failing controls.
          python3 tools/uberhar/test_vertex_register_decode.py \
            --compiler "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --qemu "$(command -v qemu-aarch64)"

      - name: Build Android ARM64
        working-directory: src/android
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export NDK_CCACHE="$(command -v ccache)"
          # AstraEH: Make release-flavor signing use the exact key restored/generated above.
          export ANDROID_KEYSTORE_FILE="$HOME/.android/debug.keystore"
          export ANDROID_KEYSTORE_PASS=android
          export ANDROID_KEY_ALIAS=androiddebugkey
          # AstraEH: IDE ABI injection implicitly marks APKs test-only in AGP 8.13.2.
          # Use our ndk.abiFilters property and explicitly allow ordinary tap-to-install.
          bash ./gradlew --no-daemon --max-workers=2 \
            -PuberharArm64Only=true \
            -Pandroid.injected.testOnly=false \
            assembleUberharRelease 2>&1 | tee "$GITHUB_WORKSPACE/uberhar-build.log"

      # AstraEH: Exercise production naming/parser logic before publishing any download UI.
      - name: Test Android log export names
        working-directory: src/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash ./gradlew --no-daemon --max-workers=2 -PuberharArm64Only=true \
            -Pandroid.injected.testOnly=false testUberharReleaseUnitTest

      # AstraEH: Publish only an intact ARM64 app with the separate ID, label and valid signature.
      - name: Validate package and record provenance
        run: |
          set -o pipefail
          # CodexAstraUlt: Replace the opaque aggregate-step failure with fixed gate
          # annotations. Preserve every gate and its exit status; never print commands
          # or environment values, and keep APK upload conditional on full success.
          validation_gate='artifact directory'
          trap 'validation_status=$?; printf "::error title=APK validation gate failed::%s (exit %s)\n" "$validation_gate" "$validation_status"; exit "$validation_status"' ERR
          mkdir -p artifacts
          validation_gate='native APK integrity, ABI and dependencies'
          python3 tools/uberhar/validate_apk.py src/android/app/build artifacts | tee artifacts/native-validation.txt
          validation_gate='APK discovery and package metadata'
          APK="$(find artifacts -name '*.apk' -print -quit)"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" > artifacts/package.txt
          validation_gate='package identity'
          grep "package: name='org.uberhar.uberhar_emu'" artifacts/package.txt
          # AstraEH: Verify beta launcher branding without changing the install identity.
          validation_gate='launcher label'
          grep -F "application-label:'Uberhar Beta'" artifacts/package.txt
          # AstraEH: Signatures can verify even when Android refuses normal installation.
          # aapt emits this marker only for test-only apps; reject before publishing.
          if grep -q '^testOnly=' artifacts/package.txt; then
            # CodexAstraUlt: Explicit exits bypass ERR; retain the rejection with a visible annotation.
            echo '::error title=APK validation gate failed::Refusing a test-only APK: normal Android installation would fail' >&2
            exit 1
          fi
          # AstraEH: Inspect the final merged manifest, including third-party dependency declarations.
          export JAVA_HOME="$JAVA_HOME_17_X64"
          validation_gate='merged manifest extraction'
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > artifacts/AndroidManifest.xml
          validation_gate='merged manifest install requirements'
          # CodexAstraLocal: Require explicit shell profiling in the optimized
          # Uberhar flavor so the next single-run CPU observation can use symbols.
          python3 tools/uberhar/validate_manifest.py artifacts/AndroidManifest.xml "$UBERHAR_VERSION" \
            --require-shell-profiling > artifacts/install-validation.txt
          validation_gate='APK alignment'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" > artifacts/alignment.txt
          validation_gate='APK signature verification'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > artifacts/signature.txt
          # AstraEH: Reject a changed signing key instead of releasing an APK that cannot update.
          validation_gate='approved signing certificate'
          grep -F "Signer #1 certificate SHA-256 digest: $(cat tools/uberhar/development-certificate.sha256)" artifacts/signature.txt
          validation_gate='source revision provenance'
          git rev-parse HEAD > artifacts/uberhar-commit.txt
          # AstraEH: Native tombstones are useful only with symbols from this exact build.
          validation_gate='native debug symbols'
          SYMBOLS="src/android/app/build/outputs/native-debug-symbols/uberharRelease/native-debug-symbols.zip"
          test -s "$SYMBOLS"
          cp "$SYMBOLS" "artifacts/uberhar-$UBERHAR_VERSION-native-symbols.zip"
          validation_gate='Android obfuscation mapping'
          test -s src/android/app/build/outputs/mapping/uberharRelease/mapping.txt
          cp src/android/app/build/outputs/mapping/uberharRelease/mapping.txt artifacts/android-mapping.txt
          validation_gate='submodule and release-note provenance'
          git submodule status --recursive > artifacts/submodules.txt
          cp UBERHAR.md artifacts/
          cp "docs/releases/$UBERHAR_VERSION.md" artifacts/release-notes.md
          validation_gate='validation report archive'
          python3 -m zipfile -c "artifacts/uberhar-$UBERHAR_VERSION-validation.zip" \
            artifacts/package.txt artifacts/AndroidManifest.xml artifacts/install-validation.txt \
            artifacts/native-validation.txt artifacts/alignment.txt artifacts/signature.txt \
            artifacts/uberhar-commit.txt artifacts/submodules.txt artifacts/UBERHAR.md \
            artifacts/android-mapping.txt

      - uses: actions/upload-artifact@v7
        with:
          name: uberhar-${{ steps.version.outputs.value }}-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uberhar-build-log-${{ github.run_number }}
          path: uberhar-build.log
          if-no-files-found: ignore
          retention-days: 14

      # CodexAstraLocal: Preserve synthetic execution/failure-control evidence
      # even when the ARM contract gate stops a candidate before app packaging.
      # CodexAstraLocal: Include the observable gate's separate raw compiler/run
      # streams and synthetic exports, not only its hashed provenance summary.
      # CodexAstraLocal: Retain the new transport gate's raw outcomes on failure
      # too, distinguishing deliberate terminal controls from a stalled job.
      # CodexAstraLocal: Include packed-decoder compiler/semantic evidence even
      # when a candidate fails before Android packaging or publication.
      - name: Upload ARM64 shader contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uberhar-arm64-shader-proof-${{ github.run_number }}
          path: |
            build/uberhar-probe/shader-a64-return/**/provenance.json
            build/uberhar-probe/shader-a64-return/**/*.log
            build/uberhar-probe/shader-a64-return/**/*.jsonl
            build/uberhar-probe/shader-a64-writeback/**/provenance.json
            build/uberhar-probe/shader-a64-writeback/**/*.log
            build/uberhar-probe/shader-a64-writeback/**/*.jsonl
            build/uberhar-probe/guest-a64-fpsr/**/provenance.json
            build/uberhar-probe/guest-a64-fpsr/**/*.log
            build/uberhar-probe/guest-a64-fpsr/**/*.jsonl
            build/uberhar-probe/parallel-vertex-observable/**/provenance.json
            build/uberhar-probe/parallel-vertex-observable/**/*.log
            build/uberhar-probe/parallel-vertex-observable/**/*.jsonl
            build/uberhar-probe/parallel-vertex-observable/**/*.stdout
            build/uberhar-probe/parallel-vertex-observable/**/*.stderr
            build/uberhar-probe/parallel-vertex-observable/**/cases.json
            build/uberhar-probe/parallel-transport/**/provenance.json
            build/uberhar-probe/parallel-transport/**/*.stdout
            build/uberhar-probe/parallel-transport/**/*.stderr
            build/uberhar-probe/vertex-register-decode/**/provenance.json
            build/uberhar-probe/vertex-register-decode/**/*.stdout
            build/uberhar-probe/vertex-register-decode/**/*.stderr
            build/uberhar-probe/vertex-register-decode/**/*.output.bin
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve compilation cache even if packaging validation fails
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/ccache
          key: uberhar-android-v1-${{ github.run_id }}

  # AstraEH: Only the publishing job can write releases; compilation keeps read-only permissions.
  publish:
    # CodexAstraUlt: Comparison artifacts do not publish or reserve a shared version.
    if: github.ref == 'refs/heads/uberhar/hybrid-shaders'
    needs: [android, shaders]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      UBERHAR_VERSION: ${{ needs.android.outputs.version }}
    steps:
      - name: Fetch the validated APK from this build
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "uberhar-$UBERHAR_VERSION-arm64" --dir artifacts
          test "$(cat artifacts/uberhar-commit.txt)" = "$GITHUB_SHA"
          cd artifacts
          sha256sum --check apk-sha256.txt

      # AstraEH: Attach assets to a draft first; publish only when all uploads succeed.
      # Existing versions are never overwritten: increment UBERHAR_VERSION for the next iteration.
      # CodexAstraLocal: The same gated job publishes alpha prereleases
      # and earned beta releases according to the version classification below.
      - name: Publish GitHub release
        run: |
          if gh release view "$UBERHAR_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'This version already exists; increment UBERHAR_VERSION before publishing again' >&2
            exit 1
          fi
          # AstraEH: An inherited tag must never redirect this release to unrelated upstream code.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$UBERHAR_VERSION" > existing-tag.json 2>/dev/null; then
            test "$(jq -r '.object.sha' existing-tag.json)" = "$GITHUB_SHA"
          fi
          # CodexAstraLocal: Replace the unconditional prerelease flag with the owner's
          # Full Release.Beta.Alpha rule: a zero alpha component publishes a full release.
          # Apply the same classification to draft creation and publication; all prior
          # correctness/signing/provenance gates and latest=false remain mandatory.
          release_prerelease=true
          if [[ "${UBERHAR_VERSION##*.}" =~ ^0+$ ]]; then
            release_prerelease=false
          fi
          gh release create "$UBERHAR_VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Uberhar $UBERHAR_VERSION" \
            --draft "--prerelease=$release_prerelease" --latest=false --notes-file artifacts/release-notes.md \
            "artifacts/uberhar-$UBERHAR_VERSION-arm64.apk" artifacts/apk-sha256.txt \
            "artifacts/uberhar-$UBERHAR_VERSION-validation.zip" \
            "artifacts/uberhar-$UBERHAR_VERSION-native-symbols.zip"
          gh release edit "$UBERHAR_VERSION" --repo "$GITHUB_REPOSITORY" \
            --draft=false "--prerelease=$release_prerelease" --latest=false
