# AstraEH: Audit-only branch helper; no APK build, signing or publication.
# This workflow is not merged into uberhar/hybrid-shaders.
name: Uberhar pinned source audit snapshot
on:
  push:
    branches: [uberhar/audit-0.1.6-snapshot]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f97f67b416cdd369638dd9486b08aac793ba5c6a
          persist-credentials: false
      - name: Materialize pinned test dependencies
        run: git submodule update --init --depth 1 externals/fmt externals/xxHash externals/boost externals/nihstro externals/vulkan-headers externals/microprofile
      - name: Archive public source without Git metadata or credentials
        run: |
          test "$(git rev-parse HEAD)" = f97f67b416cdd369638dd9486b08aac793ba5c6a
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git submodule status --recursive > "$RUNNER_TEMP/source-submodules.txt"
          tar --exclude=.git -czf "$RUNNER_TEMP/uberhar-source-f97f67b.tar.gz" .
          sha256sum "$RUNNER_TEMP/uberhar-source-f97f67b.tar.gz" > "$RUNNER_TEMP/source-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: uberhar-source-f97f67b
          path: |
            ${{ runner.temp }}/uberhar-source-f97f67b.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-submodules.txt
            ${{ runner.temp }}/source-sha256.txt
          retention-days: 1
