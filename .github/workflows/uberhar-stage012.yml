# AstraPro: Isolated, exact-source staging only; production promotion is separate.
name: Uberhar stage reviewed 0.1.12
on:
  push:
    branches: [uberhar/stage012-helper]
    paths: [.github/workflows/uberhar-stage012.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 22abb13398fb161c4122e8ee839372ea44c64a87
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize pinned host-test headers
        run: git submodule update --init --depth 1 externals/fmt externals/boost
      - name: Verify exact source, test regression and stage commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          parent = '22abb13398fb161c4122e8ee839372ea44c64a87'
          parts = ['58ecad79c5619869f6053488814472ebd7645cbe',
                   '888e15740aa03c118206a8f2db2c4d3318db8237',
                   '7d8868778c82140b441bea3f98e26e25308badfe',
                   '9bbce78cedde4dc1c9b8d009747d53805686c6ea',
                   '14971d474644076a3815cedaf0866d20d816a7de',
                   'ef79cb1477a448782129dea2284dcd1f14bc3f40',
                   'f90cc9ff02091f829ff2bf3b7a2dd82314dc09f5',
                   '5d831247b5434e69013495158e17a61476a00544',
                   'c7ba271a06c84334e9b5ed8a79008129e6b12e4a',
                   '0871606aee47aa5ec35b03c9783f55389438a5d0',
                   '166c1dde37dddd9823bdcac4214d851be70b0998']
          data = bytearray()
          for sha in parts:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/RegiRex/uberhar/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = json.load(response)
              assert body['encoding'] == 'base64'
              chunk = base64.b64decode(body['content'])
              assert hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest() == sha
              data.extend(chunk)
          assert len(data) == 24181
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '73a4c3d64f7eae589a602ee4a5ac4ab2199b9d9907de6ac95f1bffe5cf775acf'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == parent
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-012.patch'
          patch.write_bytes(data)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          assert pathlib.Path('UBERHAR_VERSION').read_text().strip() == '0.1.12'
          paths = ['UBERHAR_VERSION','src/video_core/rasterizer_accelerated.cpp',
                   'src/video_core/rasterizer_accelerated.h',
                   'src/video_core/renderer_vulkan/vk_rasterizer.cpp',
                   'tools/uberhar/build_probe.sh','tools/uberhar/test_uniform_retry.py',
                   'docs/UBERHAR_CODE_MAP.md','docs/UBERHAR_DIAGNOSTICS.md',
                   'docs/UBERHAR_REVIEW_CADENCE.md','docs/UBERHAR_CORRECTNESS_0.1.12.md',
                   'docs/releases/0.1.12.md']
          subprocess.run(['git','add','--',*paths],check=True)
          staged = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(staged) == sorted(paths)
          files = {p:subprocess.check_output(['git','rev-parse',':'+p],text=True).strip() for p in paths}
          manifest = hashlib.sha256(json.dumps(files,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert manifest == '2e64939ea073429c2866b373220afe9210929b55576f4faae715505b65c9979d'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['python3','tools/uberhar/test_uniform_retry.py'],check=True)
          subprocess.run(['git','config','user.name','AstraPro'],check=True)
          subprocess.run(['git','config','user.email','83982867+RegiRex@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','AstraPro: 0.1.12 retain pending vertex uniforms across GPU retries'],check=True)
          commit = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          auth = base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,
                          'push','https://github.com/RegiRex/uberhar.git',
                          'HEAD:refs/heads/uberhar/stage-0.1.12-reviewed'],check=True)
          proof = {'parent':parent,'commit':commit,'tree':tree,'patch_sha256':digest,
                   'files_sha256':manifest,'files':files,'production_updated':False}
          pathlib.Path(os.environ['RUNNER_TEMP'],'stage-proof.json').write_text(json.dumps(proof,indent=2))
          print('STAGED_COMMIT='+commit+' TREE='+tree+' VERIFIED_FILES='+manifest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uberhar-stage-proof-012
          path: ${{ runner.temp }}/stage-proof.json
          retention-days: 7
