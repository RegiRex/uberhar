# AstraEH: Exercise production GLSL generation and combiner math without an Android device.
name: Uberhar shader correctness

on:
  workflow_dispatch:
  # AstraEH: The release workflow calls this gate and waits for it before publication.
  workflow_call:
    # CodexAstraUlt: Let the trusted comparison caller select its immutable head
    # SHA instead of implicitly testing concurrent changes in a synthetic PR merge.
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  shaders:
    runs-on: ubuntu-24.04
    # AstraEH: Expanded lighting corpus validates both optimizer modes and offscreen pixels.
    # CodexAstraLocal: The .39 shader job took 31.78 minutes before adding the
    # static-TEV/cache/ABI controls. Keep a finite margin without dropping checks.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # CodexAstraUlt: Manual runs retain their source SHA; callers may pin a PR head.
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      # AstraEH: Test production first-ready completion before any renderer release.
      - name: Test asynchronous pipeline completion
        run: |
          mkdir -p build/uberhar-tests
          c++ -std=c++20 -O2 -pthread -I src tools/uberhar/test_async_completion.cpp \
            -o build/uberhar-tests/test-async-completion
          timeout 30s build/uberhar-tests/test-async-completion
      - name: Get generator dependencies
        # AstraEH: The production interpreter test also includes MicroProfile's disabled header.
        # CodexAstraUlt: The real Libretro logger regression also needs its pinned API header;
        # a full local checkout already has it, but this narrow CI checkout must fetch it.
        # CodexAstraLocal: The mixed-depth regression executes the production x64 JIT.
        # CodexAstraLocal: The scratch regression executes the pinned runtime GLSL
        # parser/preamble, rather than relying only on separately adapted CLI shaders.
        run: git submodule update --init --depth 1 externals/fmt externals/xxHash externals/boost externals/nihstro externals/vulkan-headers externals/microprofile externals/xbyak externals/libretro-common/libretro-common externals/glslang
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools libegl1-mesa-dev libgl1-mesa-dri
          python3 -m venv /tmp/uberhar-test-env
          /tmp/uberhar-test-env/bin/pip install moderngl==5.12.0 glcontext==3.0.0
      - name: Compile production generator and emit cases
        run: bash tools/uberhar/build_probe.sh
      - name: Validate Vulkan fragment modules
        # AstraEH: Both user-selectable frontend optimizer modes must preserve
        # valid Vulkan modules and the compact TEV loop's no-unroll hint.
        # AstraEH: New lighting source permutations must pass Vulkan validation, too.
        run: python3 tools/uberhar/validate_shaders.py build/uberhar-probe/cases build/uberhar-probe/fragment-state
      - name: Compare TEV results with specialized generator
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/compare_tev.py build/uberhar-probe/cases
      # CodexAstraLocal: Keep the legacy TEV gate and require the new partial
      # route's exact prepared-plan pixels, lazy fetches and validated modules.
      - name: Compare static TEV prepared plan, pixels and modules
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/test_static_tev_generator.py --reuse-build --render --require-spirv
      # AstraEH: Exercise runtime alpha/fog/scissor/depth/texture state on complete fragment shaders.
      - name: Compare full fragment color and depth
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/compare_fragment_state.py build/uberhar-probe/fragment-state
      # CodexAstraLocal: Connect actual CPU software vertices and the production
      # trivial VS to both fragment routes, including state changes and optimized
      # binary execution. Vulkan validation is separate from host pixel evidence.
      - name: Compare CPU vertex fragment ABI and optimized binaries
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        # CodexAstraLocal: Preserve full/generic comparisons and add the partial
        # route, its dynamic transport and mixed-route restoration to this gate.
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/test_cpu_fragment_abi.py --static-tev --render --require-spirv
      # CodexAstraUlt: Vary actual vertex outputs; constant-quaternion fragment
      # fixtures cannot catch missing per-triangle hemisphere correction.
      - name: Compare quaternion interpolation with CPU triangles
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/test_gpu_quaternion_parity.py --render-only
      # CodexAstraUlt: Execute typed vertex inputs, including real fourth-component
      # controls, after the production loader/interpreter/generator host comparison.
      - name: Compare emulated vertex attribute padding
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/test_gpu_attribute_padding.py --render-only
      # CodexAstraLocal: Execute the emitted missing-W divergence and written-W
      # control after the production CPU/admission probe; host Mesa is not Thor parity.
      - name: Compare mapped vertex output defaults with CPU
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/test_gpu_output_guard.py --render-only
      # CodexAstraLocal: Fixed witnesses must fail in both legacy mixed depth
      # directions and recover with precise production shaders, including SPIR-V.
      - name: Compare JIT and GPU dot depth coverage
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/test_gpu_dot_depth.py --render-only --require-spirv
      # CodexAstraLocal: Replay synthetic bounded captures with real typed fetch
      # and bound uniforms; Mesa evidence does not establish Thor pixel correctness.
      - name: Compare bounded vertex replay with production CPU
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/test_vertex_capture_replay.py --render --reuse-build
      # AstraEH: Native-vs-compute pixels plus Vulkan/SPIR-V validation gate publication.
      - name: Compare compute rasterization with native triangles
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/compare_compute_rect.py --require-vulkan
      # CodexAstraLocal: Compare both bounded scratch routes with the independent
      # image oracle, original CPU vertices and validated production Vulkan shaders.
      # Reuse only the source/payload-hashed fixture emitted by the preceding host gate.
      - name: Compare isolated compute benchmark supported pixels
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: /tmp/uberhar-test-env/bin/python tools/uberhar/test_compute_benchmark.py --render --require-vulkan --reuse-build

      # CodexAstraLocal: Host compiler failures must retain the actual captured
      # transport/assembly stderr, including when a control stops the probe.
      # CodexAstraLocal: Preserve host decoder failures and exact input/output
      # digests alongside the other prerequisite CPU contracts.
      # CodexAstraLocal: Retain source-derived stream-order compile and mutation
      # evidence so a CI-only command-order failure remains inspectable.
      # CodexAstraLocal: Preserve actual cache/worker .log diagnostics and
      # provenance for both legacy and static-tier controls, including failure.
      # CodexAstraLocal: Keep the compiler-policy fixture and exact assertion
      # diagnostics when optional-lane or frontend controls reject a candidate.
      - name: Upload CPU coordination contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uberhar-host-coordination-proof-${{ github.run_number }}
          path: |
            build/uberhar-probe/parallel-transport/**/provenance.json
            build/uberhar-probe/parallel-transport/**/*.stdout
            build/uberhar-probe/parallel-transport/**/*.stderr
            build/uberhar-probe/parallel-assembly/**/provenance.json
            build/uberhar-probe/parallel-assembly/**/*.stdout
            build/uberhar-probe/parallel-assembly/**/*.stderr
            build/uberhar-probe/vertex-register-decode/**/provenance.json
            build/uberhar-probe/vertex-register-decode/**/*.stdout
            build/uberhar-probe/vertex-register-decode/**/*.stderr
            build/uberhar-probe/vertex-register-decode/**/*.output.bin
            build/uberhar-probe/vulkan-stream-order/**/provenance.json
            build/uberhar-probe/vulkan-stream-order/**/*.stdout
            build/uberhar-probe/vulkan-stream-order/**/*.stderr
            build/uberhar-probe/shader-jit-lease/**/provenance.json
            build/uberhar-probe/shader-jit-lease/**/*.stdout
            build/uberhar-probe/shader-jit-lease/**/*.stderr
            build/uberhar-probe/cpu-draw-queue/**/provenance.json
            build/uberhar-probe/cpu-draw-queue/**/*.stdout
            build/uberhar-probe/cpu-draw-queue/**/*.stderr
            build/uberhar-probe/deferred-upload/**/provenance.json
            build/uberhar-probe/deferred-upload/**/*.stdout
            build/uberhar-probe/deferred-upload/**/*.stderr
            build/uberhar-probe/passive-memory/**/provenance.json
            build/uberhar-probe/deferred-vertex-retention/**/provenance.json
            build/uberhar-probe/deferred-vertex-retention/**/*.stdout
            build/uberhar-probe/deferred-vertex-retention/**/*.stderr
            build/uberhar-probe/ready-cpu-fragments/**/provenance.json
            build/uberhar-probe/ready-cpu-fragments/**/*.log
            build/uberhar-probe/optional-fragment-worker/**/provenance.json
            build/uberhar-probe/optional-fragment-worker/**/*.log
            build/uberhar-probe/test-shader-compile-policy*.cpp
            build/uberhar-probe/test-shader-compile-policy*.stdout
            build/uberhar-probe/test-shader-compile-policy*.stderr
            build/uberhar-probe/static-tev-generator/**
            build/uberhar-probe/cpu-fragment-abi/**
            !build/uberhar-probe/static-tev-generator/**/mesa-cache/**
            !build/uberhar-probe/cpu-fragment-abi/**/mesa-cache/**
          if-no-files-found: ignore
          retention-days: 14
